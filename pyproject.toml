[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goat-ai"
version = "0.1.0"
description = "Research infrastructure for a historical GOAT Format Yu-Gi-Oh! agent"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ml = ["torch>=2.3"]
native = ["meson>=1.7", "ninja>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

